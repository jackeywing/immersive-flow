<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireflow Viewer · Brand-Sponsored Flow Level</title>
<style>
  /* ============================================================
     Design system — v2
     Greyscale base (>85% of every screen) + TWO semantic accents:
       GREEN #58CC02 → primary path actions & completion states
                       (3-D primary buttons, success/restore, progress fill)
       BLUE  #1CB0F6 → AI interaction & multimodal delta
                       (VAD barge-in bars, Lily's live bubble, 3-min timer,
                        AI phoneme diagnostic)
     No third colour. Red is permitted only on the depleted heart, tiny area.
     ============================================================ */
  :root{
    --ink:#4B4B4B;          /* main text */
    --strong:#1A1A1A;       /* strokes / emphasis */
    --soft:#E5E5E5;         /* borders */
    --fill:#FFFFFF;         /* cards */
    --alt:#F7F7F7;          /* app background */
    --place:#EDEDED; --place2:#E0E0E0;
    --mut:#AFAFAF; --anno:#777;
    --page:#F7F7F7;
    --accent:#58CC02; --accent-d:#46A302;   /* GREEN · primary action / completion */
    --ai:#1CB0F6;    --ai-d:#1899D6;        /* BLUE  · AI & immersive surfaces   */
    --ai-wash:#EAF7FE;                      /* blue family, tinted wash          */
    --warn:#FF4B4B;                         /* RED   · depleted heart only       */
    --r-card:16px; --r-modal:20px; --r-pill:9999px;
    --s:0.80;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--page);color:var(--ink);padding:16px 22px 22px;min-height:100vh;}
  .noCo .callout{display:none;}
  svg{display:block;}
  /* .ic must be a real box everywhere — not only when it is a direct flex child */
  .ic{display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .ic svg{width:100%;height:100%;}

  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    border-bottom:2px solid var(--strong);padding-bottom:10px;margin-bottom:10px;}
  header h1{font-size:16px;letter-spacing:.2px;color:var(--strong);}
  header h1 small{font-weight:700;color:var(--mut);font-size:11px;margin-left:9px;letter-spacing:0;}
  .tools{display:flex;gap:9px;align-items:center;}
  .tbtn{background:#fff;border:2px solid var(--ink);border-radius:var(--r-pill);padding:7px 14px;
    font-family:inherit;font-weight:800;font-size:11px;cursor:pointer;color:var(--ink);white-space:nowrap;flex:none;}
  .tbtn:hover{background:var(--alt);}
  .hint{font-size:10.5px;color:var(--mut);font-weight:700;}
  .accentchip{border:2px solid var(--accent-d);color:var(--accent-d);border-radius:var(--r-pill);
    padding:3px 9px;font-size:9.5px;font-weight:900;letter-spacing:.5px;}
  .aichip{border:2px solid var(--ai-d);color:var(--ai-d);border-radius:var(--r-pill);
    padding:3px 9px;font-size:9.5px;font-weight:900;letter-spacing:.5px;}

  .strip{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 2px 10px;}
  .step{flex:none;border:2px solid var(--soft);background:#fff;border-radius:var(--r-pill);padding:7px 13px;
    font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.12s;color:var(--anno);}
  .step:hover{border-color:var(--ink);color:var(--ink);}
  .step.on{border-color:var(--strong);background:var(--strong);color:#fff;}
  .step.fb{border-style:dashed;}
  .step .badge{display:inline-block;background:var(--strong);color:#fff;border-radius:4px;
    font-size:8.5px;padding:1px 4px;margin-left:5px;letter-spacing:.4px;}
  .step.on .badge{background:#fff;color:var(--strong);}
  .sarrow{flex:none;color:var(--mut);font-size:11px;font-weight:900;}
  .fbrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}

  .viewer{display:grid;grid-template-columns:314px 1fr;gap:26px;align-items:start;}
  @media(max-width:840px){.viewer{grid-template-columns:1fr;}}
  .stage{width:314.4px;height:681.6px;position:relative;}
  .stage .phone{position:absolute;top:0;left:0;transform:scale(var(--s));transform-origin:top left;}

  .phone{width:393px;height:852px;background:var(--fill);border:2px solid var(--strong);
    border-radius:26px;overflow:hidden;display:flex;flex-direction:column;}
  .phone::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:96px;height:20px;background:var(--place2);border-radius:11px;z-index:6;}
  .statusbar{display:flex;justify-content:space-between;padding:11px 18px 4px;}
  .tk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;letter-spacing:.3px;color:var(--strong);}
  .tk .ic{color:var(--ink);}
  .tk.low{color:var(--warn);}
  .tk.low .ic{color:var(--warn);}
  .switchrow{display:flex;align-items:center;gap:11px;border:2px solid var(--soft);border-radius:var(--r-card);
    padding:11px;margin-bottom:11px;background:#fff;cursor:pointer;font-family:inherit;text-align:left;width:100%;}
  .switchrow .stx{flex:1;font-size:10.5px;font-weight:800;color:var(--anno);line-height:1.45;}
  .switch{width:46px;height:26px;border-radius:var(--r-pill);background:var(--place2);position:relative;flex:none;
    transition:background .12s;border:2px solid var(--soft);}
  .switch::after{content:'';position:absolute;top:1px;left:1px;width:18px;height:18px;border-radius:50%;
    background:#fff;border:2px solid var(--mut);transition:transform .12s;box-sizing:content-box;}
  .switchrow.on .switch{background:var(--strong);border-color:var(--strong);}
  .switchrow.on .switch::after{transform:translateX(20px);border-color:var(--strong);}
  .adbadge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--soft);border-radius:var(--r-pill);
    padding:5px 11px;font-size:10px;font-weight:900;letter-spacing:.2px;color:var(--anno);background:#fff;}
  .adbadge .ic{color:var(--anno);}
  .adtimer{font-size:10.5px;font-weight:900;letter-spacing:.2px;color:var(--strong);}
  .adbody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 16px;}
  .adframe{width:100%;aspect-ratio:16/9;border-radius:var(--r-card);background:var(--alt);
    border:2px solid var(--soft);display:flex;align-items:center;justify-content:center;}
  .phavatar.wm{position:relative;overflow:hidden;}
  .phavatar.wm .wmbg{position:absolute;left:50%;top:-14px;transform:translateX(-50%);
    width:122px;height:122px;color:var(--place2);display:flex;}
  .phavatar.wm .wmbg svg{width:100%;height:100%;}
  .phavatar.wm .wmfg{position:relative;z-index:1;}
  .loadbar{width:168px;height:12px;border:2px solid var(--soft);border-radius:var(--r-pill);
    overflow:hidden;background:#fff;}
  .loadbar i{display:block;height:100%;width:36%;background:var(--ink);border-radius:var(--r-pill);
    animation:load 2s ease-in-out infinite;}
  @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;
    border-bottom:2px solid var(--soft);}
  .tbgrp{display:flex;gap:10px;align-items:center;}
  .tbp{width:34px;height:12px;background:var(--place);border-radius:4px;}
  .tbx{width:16px;height:16px;border:2px solid var(--mut);border-radius:4px;}
  /* BLUE SURFACE — the 3-minute session timer (AI budget, never a paywall clock) */
  .timer{font-size:11.5px;font-weight:900;letter-spacing:.6px;color:var(--ai-d);
    border:2px solid var(--ai);border-radius:var(--r-pill);padding:2px 9px;}
  .canvas{flex:1;padding:18px 16px;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--alt);}
  .canvas.flush{padding:0;}

  .ph{background:var(--place);border-radius:4px;}
  .ph.txt{height:11px;}
  .phbox{border:2px solid var(--soft);border-radius:var(--r-card);background:var(--fill);}
  .phbox.dark{border-color:var(--ink);}
  .phavatar{width:44px;height:44px;border:2px solid var(--ink);border-radius:var(--r-card);background:var(--alt);
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;color:var(--anno);
    letter-spacing:.4px;flex:none;font-weight:900;}
  .phavatar.sm{width:30px;height:30px;font-size:8.5px;border-radius:10px;}

  /* ---------- 3D press button (Duolingo craft) ---------- */
  .btn{width:100%;border:2px solid var(--strong);border-bottom-width:4px;border-radius:var(--r-pill);
    background:var(--strong);color:#fff;font-weight:900;font-size:12.5px;letter-spacing:.6px;text-align:center;
    padding:15px 12px;font-family:inherit;cursor:pointer;margin-bottom:13px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .06s, border-bottom-width .06s;
    -webkit-user-select:none;user-select:none;}
  .btn:active{transform:translateY(2px);border-bottom-width:2px;}
  .btn.sec{background:#fff;color:var(--ink);border-color:var(--soft);}
  /* GREEN SURFACE — primary path action / completion (restore + conversion CTA) */
  .btn.accent{background:var(--accent);border-color:var(--accent-d);color:#fff;}
  .btn.sm{padding:11px;font-size:11px;}
  .btn.tx{background:transparent;border:0;color:#777;font-size:11.5px;font-weight:900;
    letter-spacing:.3px;padding:11px;text-decoration:underline;text-underline-offset:3px;}
  .btn.tx:active{transform:none;border-bottom-width:0;}
  .btn .ic{width:16px;height:16px;}

  /* path */
  .unithead{border:2px solid var(--soft);border-radius:var(--r-card);padding:11px 13px;margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:center;background:var(--fill);}
  .unithead .u1{font-size:9.5px;font-weight:900;color:var(--mut);letter-spacing:.8px;}
  .unithead .u2{font-size:12px;font-weight:900;margin-top:3px;color:var(--strong);}
  .pathcol{display:flex;flex-direction:column;align-items:center;gap:20px;}
  .nodewrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .node{width:62px;height:62px;border:2px solid var(--ink);border-radius:50%;background:var(--fill);
    display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .node svg{width:26px;height:26px;}
  .node.locked{border-style:dashed;background:var(--alt);color:var(--mut);}
  .node.cur{color:var(--strong);box-shadow:0 0 0 5px var(--soft);}
  .nlabel{font-size:9px;font-weight:900;color:var(--anno);letter-spacing:.6px;text-align:center;}
  .nlabel.max{color:var(--strong);}
  .startbub{border:2px solid var(--strong);border-radius:var(--r-pill);padding:4px 11px;font-size:9px;
    font-weight:900;letter-spacing:.7px;background:#fff;color:var(--strong);}

  /* ---- Frame 1 · Duolingo learning path (snake) ---- */
  .unitbar{display:flex;justify-content:space-between;align-items:center;padding:2px 16px 12px;}
  .ubico{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;}
  .ubico svg{width:100%;height:100%;}
  .ubname{font-size:11.5px;font-weight:900;letter-spacing:.7px;color:var(--strong);}
  .ubheart{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:900;color:var(--strong);}
  .ubheart .ic{width:18px;height:18px;}
  .sectcard{margin:0 16px;border:2px solid var(--soft);border-radius:var(--r-card);padding:10px 13px;
    display:flex;justify-content:space-between;align-items:center;background:#fff;}
  .sectcard .st{font-size:11px;font-weight:900;color:var(--strong);letter-spacing:.4px;}
  .sectcard .ss{font-size:8.5px;font-weight:800;color:var(--mut);margin-top:3px;letter-spacing:.6px;}
  .path{position:relative;flex:1;min-height:0;}
  .pline{position:absolute;left:0;top:0;width:100%;height:340px;}
  .node{position:absolute;border-radius:var(--r-pill);background:#fff;border:2px solid var(--ink);
    color:var(--ink);display:flex;align-items:center;justify-content:center;}
  .node > svg{width:52%;height:52%;}
  .node .tick{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;
    background:var(--strong);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #fff;}
  .node .tick svg{width:8px;height:8px;}
  .node.done{box-shadow:0 4px 0 0 #D8D8D8;}
  .node.active{border-width:3px;color:var(--strong);box-shadow:0 5px 0 0 #D8D8D8;}
  .node.locked{border:2px dashed #C9C9C9;color:#C9C9C9;background:var(--alt);box-shadow:none;}
  .node.mic{background:var(--strong);border-color:var(--strong);color:#fff;box-shadow:0 5px 0 0 #242424;}
  /* the node carries a 5px 3-D base; shift the ring 2.5px so it centres on the visual mass */
  .node.mic::after{content:'';position:absolute;inset:-9px;border:2px dashed var(--ink);
    border-radius:var(--r-pill);transform:translateY(2.5px);}
  .nlab{position:absolute;font-size:8.5px;font-weight:900;letter-spacing:.5px;color:var(--mut);text-align:center;}
  .nlab.strong{color:var(--strong);}
  .bub{position:absolute;background:#fff;border:2px solid var(--ink);border-radius:var(--r-pill);
    padding:4px 10px;font-size:8.5px;font-weight:900;letter-spacing:.6px;color:var(--strong);
    white-space:nowrap;z-index:2;}
  .bub.filled{background:var(--strong);color:#fff;border-color:var(--strong);}
  .duo{position:absolute;border:2px solid var(--ink);border-radius:var(--r-pill);background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:900;
    color:var(--strong);z-index:2;}
  .sheettitle{font-size:12.5px;font-weight:900;color:var(--strong);margin-bottom:5px;line-height:1.3;}
  .cta2{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25;}
  .navbar{position:absolute;left:0;right:0;bottom:0;height:58px;background:#fff;border-top:2px solid var(--soft);
    display:flex;align-items:center;justify-content:space-around;padding:0 14px;z-index:5;}
  .navbar .nb{position:relative;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#C9C9C9;}
  .navbar .nb svg{width:100%;height:100%;}
  .navbar .nb.on{color:var(--strong);}
  .navbar .nb.on::after{content:'';position:absolute;left:0;right:0;bottom:-11px;height:3px;
    background:var(--strong);border-radius:2px;}

  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--strong);
    border-radius:22px 22px 0 0;padding:8px 16px 12px;}
  .grab{width:42px;height:5px;background:var(--place2);border-radius:3px;margin:0 auto 11px;}
  .sheetrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .valuelist{font-size:11px;font-weight:700;color:var(--anno);line-height:1.7;margin-bottom:9px;}
  .sponsorline{font-size:10px;font-weight:900;letter-spacing:.5px;text-align:center;color:var(--strong);
    border:2px dashed var(--soft);border-radius:var(--r-pill);padding:6px;margin-bottom:9px;}

  /* sponsor ad */
  .adslot{flex:1;display:flex;flex-direction:column;position:relative;background:var(--fill);}
  .adslaplabel{position:absolute;top:10px;left:-2px;background:var(--strong);color:#fff;font-size:8.5px;
    font-weight:900;letter-spacing:.9px;padding:3px 8px;border-radius:0 6px 6px 0;z-index:3;}
  .adhead{display:flex;justify-content:space-between;align-items:center;padding:34px 16px 10px;}
  .adbrand{border:2px solid var(--ink);border-radius:var(--r-pill);padding:6px 12px;font-size:10.5px;
    font-weight:900;color:var(--strong);background:#fff;}
  .adbrand span{color:var(--mut);font-weight:700;padding:0 3px;}
  .admeta{display:flex;gap:7px;align-items:center;}
  .adtag{border:2px solid var(--ink);border-radius:var(--r-pill);padding:4px 9px;font-size:8.5px;
    font-weight:900;letter-spacing:.6px;color:var(--strong);}
  .adcount{font-size:11px;font-weight:900;letter-spacing:.5px;color:var(--strong);}
  .adcreative{flex:1;margin:0 16px;border-radius:var(--r-card);background:var(--alt);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    padding:20px 18px;position:relative;}
  .admid{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;}
  .adcap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .adcreative .play{width:54px;height:54px;border:2px solid var(--strong);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--strong);}
  .adcreative .play svg{width:22px;height:22px;margin-left:3px;}
  .adstory{display:flex;gap:8px;width:100%;}
  .adstory .sframe{flex:1;height:112px;border:2px solid var(--soft);border-radius:10px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:900;
    color:var(--mut);letter-spacing:.5px;}
  .adlogo{border:2px solid var(--ink);border-radius:var(--r-card);background:#fff;
    padding:18px 24px;text-align:center;}
  .adlogo .lm{font-size:15px;font-weight:900;letter-spacing:1.2px;color:var(--strong);}
  .adlogo .ls{font-size:8.5px;font-weight:900;letter-spacing:.9px;color:var(--mut);margin-top:7px;}
  .adlogo .lbox{width:64px;height:10px;background:var(--place2);border-radius:3px;margin:14px auto 0;}
  .adcreative .cap{font-size:9.5px;font-weight:900;letter-spacing:.8px;color:var(--anno);}
  .adcreative .sub{font-size:9px;font-weight:700;color:var(--mut);text-align:center;}
  .adsound{font-size:8.5px;font-weight:900;letter-spacing:.5px;color:var(--mut);}
  .adfoot{padding:12px 16px 16px;}
  .adcta{border:2px solid var(--ink);border-bottom-width:4px;border-radius:var(--r-pill);background:#fff;
    color:var(--strong);text-align:center;font-size:11.5px;font-weight:900;letter-spacing:.6px;padding:13px;
    margin-bottom:8px;}
  .adskip{text-align:center;font-size:9px;font-weight:900;letter-spacing:.5px;color:var(--mut);margin-bottom:10px;}
  .adbar{height:8px;border:2px solid var(--soft);border-radius:var(--r-pill);overflow:hidden;margin-bottom:7px;}
  .adbar i{display:block;height:100%;width:12%;background:var(--accent);}
  .adhint{font-size:9px;font-weight:900;letter-spacing:.6px;color:var(--anno);text-align:center;}

  /* modal / prep */
  .overlay{flex:1;background:var(--place);display:flex;align-items:center;justify-content:center;
    padding:16px;position:relative;overflow:hidden;}
  .ghostunder{position:absolute;inset:14px;display:flex;flex-direction:column;justify-content:flex-start;gap:13px;opacity:.8;}
  .ghostunder .gb{background:#D8D8D8;border-radius:6px;height:13px;}
  .ghostunder .gwave{display:flex;align-items:center;justify-content:center;gap:6px;height:50px;}
  .ghostunder .gwave i{width:9px;border-radius:var(--r-pill);background:#D8D8D8;}
  .ghostunder .gbtn{background:#D8D8D8;border-radius:var(--r-pill);height:38px;}
  .modal{position:relative;border:2px solid var(--strong);border-radius:var(--r-modal);background:#fff;
    padding:15px;width:100%;box-shadow:0 6px 0 0 rgba(0,0,0,.06);}
  .mtitle{font-size:12.5px;font-weight:900;color:var(--strong);margin-bottom:9px;}
  .mbody{font-size:10.5px;font-weight:700;color:var(--anno);line-height:1.55;margin-bottom:12px;}
  .rhead{margin-bottom:14px;}
  .rhead .rh1{font-size:17px;font-weight:900;color:var(--strong);line-height:1.2;}
  .rhead .rh2{font-size:9.5px;font-weight:900;letter-spacing:.8px;color:var(--anno);margin-top:4px;}
  .mrow{border:2px solid var(--soft);border-radius:var(--r-card);padding:11px;margin-bottom:8px;
    display:flex;align-items:center;gap:10px;}
  .mrow .ic{width:26px;height:26px;border:2px solid var(--ink);border-radius:9px;
    display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;}
  .mrow .ic svg{width:15px;height:15px;}
  .mrow .lbl{font-size:9.5px;font-weight:900;letter-spacing:.6px;color:var(--anno);}
  .mrow .val{font-size:10px;font-weight:900;margin-top:3px;color:var(--strong);}
  .mrow .track{width:100%;height:7px;background:var(--place);border-radius:var(--r-pill);margin-top:7px;position:relative;overflow:hidden;}
  .mrow .track i{position:absolute;top:0;left:0;height:100%;background:var(--ink);border-radius:var(--r-pill);}
  .mrow.warn{border-style:dashed;border-color:var(--ink);}
  .noisewarn{border:2px dashed var(--strong);border-radius:var(--r-card);padding:9px 11px;margin-bottom:9px;
    display:flex;gap:9px;align-items:center;background:var(--alt);}
  .noisewarn .ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--strong);flex:none;}
  .noisewarn .ic svg{width:19px;height:19px;}
  .noisewarn .tx{font-size:9.5px;font-weight:900;letter-spacing:.3px;color:var(--strong);line-height:1.5;}
  .modesw{display:flex;gap:8px;margin-bottom:12px;}
  .mode{flex:1;border:2px solid var(--soft);border-bottom-width:4px;border-radius:var(--r-card);
    background:#fff;padding:9px 8px;cursor:pointer;font-family:inherit;text-align:left;transition:transform .06s;}
  .mode:active{transform:translateY(2px);border-bottom-width:2px;}
  .mode .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--mut);display:block;margin-bottom:6px;}
  .mode .mt{font-size:9.5px;font-weight:900;letter-spacing:.5px;color:var(--anno);display:block;}
  .mode .md{font-size:8.5px;font-weight:700;color:var(--mut);display:block;margin-top:3px;line-height:1.4;}
  .mode.on{border-color:var(--strong);}
  .mode.on .dot{background:var(--strong);border-color:var(--strong);}
  .mode.on .mt,.mode.on .md{color:var(--strong);}

  /* bridge */
  .bridgebox{flex:1;background:var(--alt);border-top:2px solid var(--soft);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:15px;position:relative;}
  .headsetwrap{position:relative;display:flex;align-items:center;justify-content:center;}
  .headsetwrap .hs{position:absolute;top:-18px;color:var(--ink);}
  .headsetwrap .hs svg{width:38px;height:38px;}
  .bridgebox .line{border:2px solid var(--strong);border-radius:var(--r-card);padding:13px 16px;font-size:12px;
    font-weight:900;line-height:1.45;background:#fff;color:var(--strong);max-width:262px;text-align:center;}
  .micring{width:54px;height:54px;border:2px solid var(--strong);border-radius:50%;display:flex;
    align-items:center;justify-content:center;color:var(--strong);}
  .micring svg{width:22px;height:22px;}
  .autoring{width:74px;height:74px;border-radius:50%;border:3px solid var(--soft);border-top-color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;color:var(--strong);
    animation:spin 2s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .autoring span{animation:spin 2s linear infinite reverse;}
  .bridgenote{font-size:9.5px;font-weight:900;color:var(--anno);text-align:center;line-height:1.6;letter-spacing:.4px;}
  .autopill{border:2px dashed var(--ink);border-radius:var(--r-pill);padding:4px 11px;font-size:8.5px;
    font-weight:900;letter-spacing:.7px;color:var(--anno);}

  /* ============ flow session ============ */
  .vadbanner{border:2px solid var(--ai);border-radius:var(--r-pill);padding:6px 11px;margin-bottom:11px;
    display:flex;align-items:center;gap:8px;background:var(--ai-wash);}
  .vadbanner .ic{width:15px;height:15px;color:var(--ai-d);flex:none;}
  .vadbanner .tx{font-size:9.5px;font-weight:900;letter-spacing:.5px;color:var(--ai-d);}
  .vadbanner .live{margin-left:auto;font-size:8.5px;font-weight:900;letter-spacing:.6px;color:var(--ai-d);}
  /* BLUE SURFACE — barge-in bars (5 rounded pill bars, never a generic waveform) */
  .vadbars{display:flex;align-items:center;justify-content:center;gap:9px;height:76px;
    border:2px solid var(--ai);border-radius:var(--r-card);background:#fff;margin-bottom:12px;}
  .vadbars i{width:11px;border-radius:var(--r-pill);background:var(--ai);height:18px;
    animation:pill 1.15s ease-in-out infinite;}
  .vadbars i:nth-child(1){animation-delay:0s}
  .vadbars i:nth-child(2){animation-delay:.14s}
  .vadbars i:nth-child(3){animation-delay:.28s}
  .vadbars i:nth-child(4){animation-delay:.42s}
  .vadbars i:nth-child(5){animation-delay:.56s}
  @keyframes pill{0%,100%{height:16px}45%{height:54px}}
  .turn{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start;}
  .turn.me{flex-direction:row-reverse;}
  .tbub{border:2px solid var(--soft);border-radius:var(--r-card);padding:10px 12px;background:#fff;}
  .turn.me .tbub{border-color:var(--ink);}
  .tlab{font-size:9px;font-weight:900;color:var(--mut);letter-spacing:.7px;margin-bottom:6px;}
  .frline{font-size:12.5px;font-weight:800;color:var(--strong);line-height:1.5;}
  .bubbletxt{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.5;}
  /* BLUE SURFACES — Lily's live channel + the semantic-mirroring highlight */
  .turn.ai .tbub{border-color:var(--ai);border-left-width:5px;}
  .mirrorchip{display:inline-block;border:2px solid var(--ai);border-radius:var(--r-pill);
    padding:2px 7px;font-size:8px;font-weight:900;letter-spacing:.6px;color:var(--ai-d);margin-bottom:7px;}
  .mirrorline{font-size:12.5px;font-weight:900;color:var(--strong);line-height:1.45;
    background:var(--ai-wash);border-radius:8px;padding:7px 9px;margin-bottom:7px;}
  .tbub{position:relative;}
  .bargin{position:absolute;right:-13px;top:-13px;width:26px;height:26px;border:2px dashed var(--ai);border-radius:50%;}
  .reserved{border:2px dashed var(--mut);border-radius:var(--r-card);padding:11px;font-size:9.5px;font-weight:900;
    color:var(--mut);text-align:center;letter-spacing:.5px;}

  /* no nested card borders — the report is flat by design */
  .scorebox{display:flex;gap:12px;align-items:center;padding:0 2px;margin-bottom:15px;background:transparent;}
  .scorebox .num{width:66px;height:52px;border-radius:var(--r-card);background:var(--alt);
    display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900;flex:none;color:var(--strong);}
  .phoneme{padding:0 2px;margin-bottom:15px;background:transparent;}
  .ailabel{font-size:8.5px;font-weight:900;letter-spacing:.7px;color:var(--ai-d);margin-bottom:8px;}
  .phonbars{display:flex;align-items:flex-end;gap:3px;height:44px;}
  .phonbars i{flex:1;background:var(--ai);border-radius:var(--r-pill);}
  .phonbars i.off{background:var(--place2);}
  .phonlegend{display:flex;gap:14px;margin-top:9px;font-size:9px;font-weight:900;color:var(--mut);}
  .wordcards{display:flex;gap:9px;margin-bottom:12px;}
  .wc{flex:1;border-radius:var(--r-card);padding:10px 6px;text-align:center;background:var(--alt);}
  .wordcards .w{font-size:11.5px;font-weight:900;color:var(--strong);}
  .wordcards .g{font-size:9px;font-weight:700;color:var(--mut);margin-top:4px;}
  .rewardrow{display:flex;gap:9px;margin-bottom:12px;}
  .rw{flex:1;border-radius:var(--r-card);padding:9px 6px;text-align:center;background:var(--alt);
    font-size:8.5px;font-weight:900;letter-spacing:.4px;color:var(--anno);}
  .rw span{display:block;font-size:15px;color:var(--strong);margin-bottom:2px;}
  .practise{border-radius:var(--r-pill);padding:10px;text-align:center;
    font-size:10px;font-weight:900;letter-spacing:.5px;color:var(--strong);margin-bottom:12px;background:var(--alt);}
  .footline{font-size:9px;font-weight:900;color:var(--mut);text-align:center;letter-spacing:.5px;}

  /* ============ out-of-hearts trigger (new Frame 1) ============ */
  .lesson{flex:1;display:flex;flex-direction:column;padding:16px;position:relative;background:var(--alt);}
  .lhead{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .lbar{flex:1;height:12px;border-radius:var(--r-pill);background:var(--place2);overflow:hidden;}
  .lbar i{display:block;height:100%;width:62%;background:var(--accent);border-radius:var(--r-pill);}
  .hrow{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:900;color:var(--warn);}
  .hrow .ic{width:17px;height:17px;}
  .qstem{font-size:14.5px;font-weight:900;color:var(--strong);line-height:1.5;margin-bottom:4px;}
  .qsub{font-size:9.5px;font-weight:800;color:var(--mut);letter-spacing:.5px;margin-bottom:16px;}
  .opt{border:2px solid var(--soft);border-radius:var(--r-card);padding:12px;margin-bottom:9px;background:#fff;
    font-size:12.5px;font-weight:800;color:var(--strong);}

  .hsheet{position:absolute;left:0;right:0;bottom:0;background:#fff;
    border-radius:var(--r-modal) var(--r-modal) 0 0;padding:10px 16px 15px;z-index:4;}
  .hpair{display:flex;align-items:center;justify-content:center;gap:13px;margin:2px 0 12px;}
  /* both cells share one line-height so icon + caption stay on the same baseline */
  .hcell{width:76px;height:70px;border-radius:var(--r-card);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;background:var(--alt);}

  .hcell .hico svg{width:100%;height:100%;}
  .hcell.low .hico{color:var(--warn);}
  .hcell.full .hico{color:var(--ink);}          /* normal grey — green is for actions, not decoration */
  .hcell .hcap{font-size:7.5px;font-weight:900;letter-spacing:.4px;color:var(--mut);
    white-space:nowrap;line-height:1;flex:none;}
  .harrow{font-size:16px;font-weight:900;color:var(--mut);}
  .htitle{font-size:17px;font-weight:900;color:var(--strong);line-height:1.2;margin-bottom:6px;}
  .hsub{font-size:11px;font-weight:700;color:var(--anno);line-height:1.6;margin-bottom:11px;}
  .sponbadge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--soft);
    border-radius:var(--r-pill);padding:4px 10px;font-size:8.5px;font-weight:900;
    letter-spacing:.5px;color:var(--anno);margin-bottom:11px;}
  .sponbadge .ic{width:12px;height:12px;color:var(--anno);}
  .hnote{font-size:8.5px;font-weight:900;letter-spacing:.4px;color:var(--mut);text-align:center;}
  .caprow{display:flex;gap:8px;margin-bottom:11px;}
  .capopt{flex:1;border:2px solid var(--soft);border-radius:var(--r-card);padding:11px 8px;text-align:center;
    font-size:9px;font-weight:900;color:var(--strong);background:#fff;line-height:1.5;letter-spacing:.3px;}
  .capopt .big{display:flex;align-items:center;justify-content:center;height:22px;margin-bottom:6px;color:var(--strong);}
  .capopt .big svg{width:20px;height:20px;}
  .htitle .htico{display:inline-flex;width:22px;height:22px;vertical-align:-4px;color:var(--warn);}
  .htitle .htico svg{width:100%;height:100%;}
  .statuspill{display:flex;align-items:center;gap:8px;border:2px solid var(--soft);border-radius:var(--r-pill);
    padding:8px 12px;margin-bottom:9px;background:#fff;font-size:10px;font-weight:900;
    color:var(--strong);letter-spacing:.3px;}
  .statuspill .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;}   /* pass state */
  .adcaption{font-size:10px;font-weight:700;color:var(--anno);text-align:center;line-height:1.55;
    padding:0 4px;margin-top:15px;font-style:italic;}
  .scorebanner{display:flex;align-items:baseline;gap:9px;margin-bottom:14px;padding:0 2px;}
  .scorebanner .sb1{font-size:26px;font-weight:900;color:var(--strong);line-height:1;}
  .scorebanner .sb2{font-size:9.5px;font-weight:900;letter-spacing:.6px;color:var(--anno);}
  .diagrow{display:flex;gap:8px;margin-bottom:14px;}
  .diag{flex:1;border-radius:var(--r-card);background:var(--alt);padding:10px 7px;text-align:center;}
  .diag .dl{font-size:7.5px;font-weight:900;letter-spacing:.5px;color:var(--mut);margin-bottom:5px;}
  .diag .dv{font-size:11px;font-weight:900;color:var(--strong);}
  .ctasub{font-size:9.5px;font-weight:800;color:var(--anno);text-align:center;
    margin:-6px 0 13px;letter-spacing:.2px;line-height:1.45;}
  .mclose{position:absolute;top:10px;right:10px;width:26px;height:26px;border:0;background:transparent;
    color:var(--anno);cursor:pointer;padding:3px;font-family:inherit;}
  .mclose svg{width:100%;height:100%;}
  .fnhead{font-size:9px;font-weight:900;letter-spacing:.8px;color:var(--mut);margin-bottom:7px;}
  .fnlist{list-style:none;display:flex;flex-direction:column;gap:6px;}
  .fnlist li{font-size:11.5px;line-height:1.5;color:var(--ink);padding-left:13px;position:relative;}
  .fnlist li::before{content:'';position:absolute;left:0;top:6px;width:5px;height:5px;
    border-radius:50%;background:var(--mut);}
  .fnlist li b{color:var(--strong);}

  /* callouts + notes */
  .callout{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--strong);color:#fff;
    font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px #fff,0 0 0 5px var(--strong);z-index:9;cursor:pointer;transition:transform .14s,opacity .14s;}
  .callout:hover{transform:scale(1.18);}
  .callout.active{transform:scale(1.34);}
  .callout.dim{opacity:.2;}
  .notesHead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .notesHead h2{font-size:15px;letter-spacing:.2px;color:var(--strong);}
  .notesHead em{font-style:normal;font-size:11.5px;color:var(--mut);font-weight:700;}
  .notesHead .core{background:var(--strong);color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:.5px;}
  .notesHead .count{margin-left:auto;font-size:11px;font-weight:800;color:var(--mut);}
  .notesBody{height:614px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:6px;}
  .anno{border:2px solid var(--soft);border-radius:var(--r-card);background:#fff;padding:12px 14px;
    display:flex;gap:12px;cursor:pointer;transition:.14s;}
  .anno:hover{border-color:var(--ink);}
  .anno .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--strong);color:#fff;
    font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .anno .body{flex:1;font-size:12px;line-height:1.55;color:var(--anno);font-weight:700;}
  .anno .body b{color:var(--strong);}
  .anno.active{background:var(--strong);border-color:var(--strong);}
  .anno.active .n{background:#fff;color:var(--strong);}
  .anno.active .body{color:#E8E8E8;}
  .anno.active .body b{color:#fff;}
  .footnote{margin-top:10px;font-size:10.5px;color:var(--mut);font-weight:700;line-height:1.65;}
  .nav{display:flex;gap:10px;align-items:center;margin-top:11px;}
  .nav button{background:#fff;border:2px solid var(--ink);border-bottom-width:4px;border-radius:var(--r-pill);
    padding:9px 16px;font-family:inherit;font-weight:900;font-size:11.5px;cursor:pointer;color:var(--ink);}
  .nav button:active{transform:translateY(2px);border-bottom-width:2px;}
  .nav button:disabled{opacity:.3;cursor:default;}
  .nav .pos{font-size:11.5px;font-weight:900;color:var(--anno);}
  .nav .sp{flex:1;}
</style>
</head>
<body>

<header>
  <h1>Brand-Sponsored Flow Level<small>Frame-by-frame wireflow · greyscale base with two semantic accents</small></h1>
  <div class="tools">
    <span class="accentchip">GREEN #58CC02 · primary action / completion</span>
    <span class="aichip">BLUE #1CB0F6 · AI surfaces only</span>
    <span class="hint">Click a number to link frame ↔ notes</span>
    <button class="tbtn" id="annoBtn" onclick="toggleCo()">Hide callouts</button>
  </div>
</header>

<div class="strip" id="strip"></div>
<div class="fbrow" id="fbrow"></div>

<div class="viewer">
  <div>
    <div class="stage"><div class="phone" id="phone"></div></div>

      <span class="sp"></span>
      <button id="bNext" onclick="move(1)">Next ▶</button>

  <div class="notes">

      <span class="count" id="fCount"></span>

    <div class="notesBody" id="notesBody"></div>
    <div class="footnote" id="footnote"></div>
  </div>
</div>

      '<b>Green means a primary action.</b> This is the only green button outside Frame 1, because it is the same kind of thing: the path forward.',
      '<b>Exit is first-class.</b> “Claim Rewards &amp; Exit”, never “Close”. The session is marked as experienced so it is not re-offered today.'
    ]},

  /* ================= branch · tap mode ================= */
  { id:'tap', title:'Branch — Tap Mode', sub:'reached from Frame 4 when noise > 60 dB', core:false, fallback:true, strip:'Branch · Tap Mode',
    body: SB + TBFLOW + `
      <div class="canvas">
        <div class="tapbanner" style="border:2px solid var(--mut);border-radius:var(--r-pill);padding:7px 11px;
          font-size:9.5px;font-weight:900;text-align:center;margin-bottom:13px;color:var(--anno)">
          TAP MODE · NO MIC NEEDED</div>
        <div class="turn"><div class="phavatar sm">LILY</div>
          <div class="tbub"><div class="tlab">LILY</div>
            <div class="frline">Bien sûr. Avec du sucre ou sans sucre ?</div></div></div>
        <div class="tapopts">
          <div class="phbox" style="padding:11px;margin-bottom:8px"><div class="frline">Sans sucre, merci.</div></div>
          <div class="phbox dark" style="padding:11px;margin-bottom:8px"><div class="frline">Avec du sucre, s’il vous plaît.</div></div>
          <div class="phbox" style="padding:11px;margin-bottom:8px"><div class="frline">Je ne sais pas encore.</div></div>
        </div>
        <div style="flex:1"></div>
        <div style="font-size:9.5px;font-weight:900;color:var(--mut);text-align:center;
          line-height:1.6;margin-bottom:10px;letter-spacing:.4px">
          SAME SCENE · SAME 3 MINUTES<br>VOICE DIAGNOSTIC → SENTENCE DIAGNOSTIC</div>
        <button class="btn sec sm">END SESSION</button>
      </div>`,
    callouts:[
      {n:1, tgt:'.tapopts', pos:'right', html:'<b>[Delta 1] Degraded Input Path.</b> The same conversation, tapped instead of spoken. Real French replies in Duolingo’s voice, and the diagnostic downgrades from phoneme scoring to sentence scoring.'}
    ],
    notes:[
      '<b>The downgrade is labelled, not disguised.</b> The banner tells the learner why the mode changed — no silent failure.',
      '<b>Both entry paths are expected states,</b> not exceptions: noise over 60 dB, or a denied mic.'
    ]},

  /* ================= branch · cap / fill failure ================= */
  { id:'cap', title:'Branch — Cap Reached / Ad Unfilled', sub:'frequency cap exhausted or the ad failed to fill · same sheet, new offer', core:false, fallback:true, strip:'Branch · Cap / No Fill',
    body: SB + TB0 + `
      <div class="canvas flush">
        <div class="lesson">
          <div class="lhead">
            <div class="lbar"><i></i></div>
            <div class="hrow">${ic('batt0',18)}0</div>
          </div>
          <div class="qstem">Complete the sentence</div>
          <div class="qsub">AT THE CAFÉ · LESSON 3 OF 5</div>
          <div class="opt">Je voudrais ___ une chambre.</div>
          <div class="opt bad">réservation</div>
          <div class="opt">réserver</div>
        </div>

        <div class="scrim"></div>

        <div class="hsheet">
          <div class="grab"></div>
          <div class="htitle">No free energy refills left today</div>
          <div class="hsub">You’ve used both sponsored refills. Your lesson is saved — here are the other ways back in.</div>
          <div class="caprow">
            <div class="capopt"><span class="big">${I.bolt}</span>350 GEMS<br>REFILL NOW</div>
            <div class="capopt"><span class="big">${I.star}</span>TRY SUPER<br>UNLIMITED HEARTS</div>
          </div>
          <button class="btn accent">${ic('rocket',15)} START 3-DAY FREE TRIAL</button>
          <button class="btn tx">Not now — keep my progress</button>
          <div class="hnote">THE AD-FAILURE PATH LANDS HERE TOO</div>
        </div>
      </div>`,
    callouts:[
      {n:1, tgt:'.caprow', pos:'right', html:'<b>[Delta 1] Graceful Ad Fallback.</b> Same sheet, honest change of offer. Frequency cap hit or the SDK returned no fill — either way the learner never sees a dead end, and never sees an ad that isn’t there.'}
    ],
    notes:[
      '<b>Frequency cap (2/day).</b> Hitting the cap swaps the ad offer for gems or the Super/Max trial instead of showing a broken button.',
      '<b>No ad fill.</b> If the SDK fails to fill, the sheet degrades to the same gems-or-trial choice — the reward is never promised and then withdrawn.',
      '<b>Progress is never punished.</b> Both exits keep the lesson state, so the interruption costs time, not work.'
    ]}
];
/* ================= viewer ================= */
const SCALE = 0.80;
let cur = 0, picked = null;

function setMode(m){
  document.querySelectorAll('#phone .mode').forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
  const sw = document.querySelector('#phone .switchrow');
  if(sw) sw.classList.toggle('on', m === 'noisy');
  const warn = document.getElementById('noiseWarn');
  const val  = document.getElementById('dbVal');
  const bar  = document.getElementById('dbBar');
  const row  = document.querySelector('#phone .mrow.noise');
  if(!warn) return;
  if(m === 'noisy'){
    warn.style.display = 'flex';
    if(val) val.textContent = '68 dB · above the 60 dB limit';
    if(bar){ bar.style.width = '88%'; }
    if(row) row.classList.add('warn');
  }else{
    warn.style.display = 'none';
    if(val) val.textContent = '58 dB · below the 60 dB limit';
    if(bar){ bar.style.width = '58%'; }
  }
  placeCallouts();
}

function toggleFallback(){
  const sw = document.querySelector('#phone .switchrow');
  setMode(sw && sw.classList.contains('on') ? 'quiet' : 'noisy');
}

function renderStrip(){
  let k = 0;
  document.getElementById('strip').innerHTML = FRAMES.map((f,i)=>{
    if(f.fallback) return '';
    const arrow = (k++ ? '<span class="sarrow">▶</span>' : '');
    return arrow + `<div class="step ${i===cur?'on':''}" onclick="go(${i})">${f.strip}` +
      (f.core ? '<span class="badge">CORE</span>' : '') + '</div>';
  }).join('');
  const at = id => FRAMES.findIndex(f => f.id === id);
  const chip = (id,label) => { const i = at(id); return i < 0 ? '' : `<div class="step fb" onclick="go(${i})">${label}</div>`; };
  document.getElementById('fbrow').innerHTML =
    '<span class="hint">Branches:</span>' +
    chip('tap','noise &gt; 60 dB → Tap Mode') +
    chip('cap','cap reached / no ad fill → gems or trial') +
    chip('check','mic denied → back to Room Check') +
    chip('core','3s silence → nudge, never a timeout');
}

function placeCallouts(){
  const phone = document.getElementById('phone');
  const pr = phone.getBoundingClientRect();
  if(!pr.height) return;
  phone.querySelectorAll('.callout').forEach(el=>{
    const t = phone.querySelector(el.dataset.tgt);
    if(!t) return;
    const r = t.getBoundingClientRect();
    /* if the target is not rendered (e.g. the noise warning in Quiet mode),
       hide the callout rather than letting it drift to the corner */
    if(!r.width && !r.height){ el.style.display = 'none'; return; }
    el.style.display = '';
    const L=(r.left-pr.left)/SCALE, T=(r.top-pr.top)/SCALE;
    const R=(r.right-pr.left)/SCALE, B=(r.bottom-pr.top)/SCALE;
    let x, y;
    switch(el.dataset.pos){
      case 'left':   x = L - 30;        y = (T+B)/2 - 12; break;
      case 'corner': x = R - 14;        y = T - 12;       break;
      default:       x = R + 6;         y = (T+B)/2 - 12;
    }
    el.style.left = Math.max(4, Math.min(369-24, x)) + 'px';
    el.style.top  = Math.max(4, Math.min(852-24, y)) + 'px';
  });
}

function render(){
  const f = FRAMES[cur];
  picked = null;
  document.getElementById('phone').innerHTML = f.body + f.callouts
    .map(c=>`<div class="callout" data-n="${c.n}" data-tgt="${c.tgt}" data-pos="${c.pos||'right'}"
              onclick="pick(${c.n})">${c.n}</div>`).join('');
  document.getElementById('notesBody').innerHTML = f.callouts
    .map(c=>`<div class="anno" data-n="${c.n}" onclick="pick(${c.n})">
        <span class="n">${c.n}</span><span class="body">${c.html}</span></div>`).join('');
  document.getElementById('fTitle').textContent = f.title;
  document.getElementById('fSub').textContent = f.sub;
  document.getElementById('fCore').style.display = f.core ? '' : 'none';
  document.getElementById('fCount').textContent = (cur+1) + ' / ' + FRAMES.length + ' frames';
  document.getElementById('footnote').innerHTML = '<div class="fnhead">TALKING POINTS · the detail behind these frames</div><ul class="fnlist">' +
    (f.notes || []).map(t => '<li>' + t + '</li>').join('') + '</ul>';
  document.getElementById('pos').textContent = (cur+1) + ' / ' + FRAMES.length;
  document.getElementById('bPrev').disabled = cur === 0;
  document.getElementById('bNext').disabled = cur === FRAMES.length-1;
  renderStrip();
  placeCallouts();
  requestAnimationFrame(placeCallouts);
}

function pick(n){
  picked = (picked === n) ? null : n;
  document.querySelectorAll('.callout').forEach(el=>{
    const on = +el.dataset.n === picked;
    el.classList.toggle('active', on);
    el.classList.toggle('dim', picked !== null && !on);
  });
  document.querySelectorAll('.anno').forEach(el=>{
    const on = +el.dataset.n === picked;
    el.classList.toggle('active', on);
    if(on && typeof el.scrollIntoView === 'function') el.scrollIntoView({block:'nearest', behavior:'smooth'});
  });
}
function go(i){ cur = Math.max(0, Math.min(FRAMES.length-1, i)); render(); }
function move(d){ go(cur + d); }
function toggleCo(){
  const on = document.body.classList.toggle('noCo');
  document.getElementById('annoBtn').textContent = on ? 'Show callouts' : 'Hide callouts';
}
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') move(1);
  if(e.key === 'ArrowLeft')  move(-1);
  if(e.key === 'Escape'){ picked = null;
    document.querySelectorAll('.callout,.anno').forEach(el=>el.classList.remove('active','dim')); }
});
window.addEventListener('resize', placeCallouts);

render();
(function(){
  const h = decodeURIComponent(location.hash.replace('#',''));
  if(!h) return;
  const parts = h.split(':');
  const i = FRAMES.findIndex(f => f.id === parts[0]);
  if(i >= 0){ cur = i; render(); if(parts[1]) pick(+parts[1]); }
})();
</script>
</body>
