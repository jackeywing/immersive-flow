<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireflow Viewer · Brand-Sponsored Flow Level</title>
<style>
  :root{
    --ink:#1A1A1A; --line:#4B4B4B; --soft:#E5E5E5;
    --fill:#FFFFFF; --alt:#F7F7F7; --place:#EDEDED; --place2:#E0E0E0;
    --mut:#9A9A9A; --anno:#6B6B6B; --page:#F0F0F0;
    --s:0.80;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
    background:var(--page);color:var(--ink);padding:16px 22px 22px;min-height:100vh;}
  .noCo .callout{display:none;}
  svg{display:block;}

  header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:10px;}
  header h1{font-size:16px;letter-spacing:.2px;}
  header h1 small{font-weight:700;color:var(--mut);font-size:11px;margin-left:9px;letter-spacing:0;}
  .tools{display:flex;gap:9px;align-items:center;}
  .tbtn{background:#fff;border:2px solid var(--line);border-radius:8px;padding:6px 11px;
    font-family:inherit;font-weight:800;font-size:11px;cursor:pointer;color:var(--ink);white-space:nowrap;flex:none;}
  .tbtn:hover{background:var(--alt);}
  .hint{font-size:10.5px;color:var(--mut);font-weight:700;}

  .strip{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 2px 10px;}
  .step{flex:none;border:2px solid var(--soft);background:#fff;border-radius:8px;padding:7px 11px;
    font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.12s;color:var(--anno);}
  .step:hover{border-color:var(--line);color:var(--ink);}
  .step.on{border-color:var(--ink);background:var(--ink);color:#fff;}
  .step.fb{border-style:dashed;}
  .step .badge{display:inline-block;background:var(--ink);color:#fff;border-radius:4px;
    font-size:8.5px;padding:1px 4px;margin-left:5px;letter-spacing:.4px;}
  .step.on .badge{background:#fff;color:var(--ink);}
  .sarrow{flex:none;color:var(--mut);font-size:11px;font-weight:900;}
  .fbrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}

  .viewer{display:grid;grid-template-columns:314px 1fr;gap:26px;align-items:start;}
  @media(max-width:840px){.viewer{grid-template-columns:1fr;}}
  .stage{width:314.4px;height:681.6px;position:relative;}
  .stage .phone{position:absolute;top:0;left:0;transform:scale(var(--s));transform-origin:top left;}

  .phone{width:393px;height:852px;background:var(--fill);border:2px solid var(--ink);
    border-radius:26px;overflow:hidden;display:flex;flex-direction:column;}
  .phone::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);
    width:96px;height:20px;background:var(--place2);border-radius:11px;z-index:6;}
  .statusbar{display:flex;justify-content:space-between;padding:11px 18px 4px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 10px;
    border-bottom:2px solid var(--soft);}
  .tbgrp{display:flex;gap:10px;align-items:center;}
  .tbp{width:34px;height:12px;background:var(--place);border-radius:4px;}
  .tbx{width:16px;height:16px;border:2px solid var(--mut);border-radius:4px;}
  .timer{font-size:11px;font-weight:900;letter-spacing:.6px;}
  .canvas{flex:1;padding:18px 16px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
  .canvas.immersive{background:var(--alt);border-top:2px solid var(--soft);}
  .canvas.flush{padding:0;}

  .ph{background:var(--place);border-radius:4px;}
  .ph.txt{height:11px;}
  .phline{height:2px;background:var(--soft);}
  .phbox{border:2px solid var(--soft);border-radius:10px;background:var(--fill);}
  .phbox.dark{border-color:var(--line);}
  .phavatar{width:44px;height:44px;border:2px solid var(--line);border-radius:12px;background:var(--alt);
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;color:var(--anno);
    letter-spacing:.4px;flex:none;}
  .phavatar.sm{width:30px;height:30px;font-size:8.5px;border-radius:9px;}

  .btn{width:100%;border:2px solid var(--line);border-radius:24px;background:var(--ink);
    color:#fff;font-weight:900;font-size:12.5px;letter-spacing:.6px;text-align:center;padding:15px 12px;
    font-family:inherit;cursor:pointer;box-shadow:0 5px 0 0 var(--line);margin-bottom:13px;
    display:flex;align-items:center;justify-content:center;gap:9px;}
  .btn.sec{background:#fff;color:var(--ink);box-shadow:0 5px 0 0 var(--soft);}
  .btn.sm{padding:11px;font-size:11px;box-shadow:0 4px 0 0 var(--line);}
  .btn.sec.sm{box-shadow:0 4px 0 0 var(--soft);}
  .btn .ic{width:16px;height:16px;}

  /* path */
  .unithead{border:2px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:center;background:var(--alt);}
  .unithead .u1{font-size:9.5px;font-weight:900;color:var(--mut);letter-spacing:.8px;}
  .unithead .u2{font-size:12px;font-weight:900;margin-top:3px;}
  .pathcol{display:flex;flex-direction:column;align-items:center;gap:20px;}
  .nodewrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .node{width:62px;height:62px;border:2px solid var(--line);border-radius:50%;background:var(--fill);
    display:flex;align-items:center;justify-content:center;color:var(--line);}
  .node svg{width:26px;height:26px;}
  .node.locked{border-style:dashed;background:var(--alt);color:var(--mut);}
  .node.cur{color:var(--ink);box-shadow:0 0 0 5px var(--soft);}
  .nlabel{font-size:9px;font-weight:900;color:var(--anno);letter-spacing:.6px;text-align:center;}
  .nlabel.max{color:var(--ink);}
  .startbub{border:2px solid var(--ink);border-radius:8px;padding:4px 9px;font-size:9px;font-weight:900;
    letter-spacing:.7px;background:#fff;}

  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--ink);
    border-radius:22px 22px 0 0;padding:10px 16px 18px;}
  .grab{width:42px;height:5px;background:var(--place2);border-radius:3px;margin:0 auto 13px;}
  .sheetrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;}
  .valuelist{font-size:11px;font-weight:700;color:var(--anno);line-height:1.85;margin-bottom:11px;}
  .sponsorline{font-size:10px;font-weight:900;letter-spacing:.5px;text-align:center;
    border:2px dashed var(--soft);border-radius:8px;padding:7px;margin-bottom:12px;}

  /* sponsor ad */
  .adslot{flex:1;display:flex;flex-direction:column;position:relative;}
  .adslaplabel{position:absolute;top:10px;left:-2px;background:var(--ink);color:#fff;font-size:8.5px;
    font-weight:900;letter-spacing:.9px;padding:3px 8px;border-radius:0 6px 6px 0;z-index:3;}
  .adhead{display:flex;justify-content:space-between;align-items:center;padding:34px 16px 10px;}
  .adbrand{border:2px solid var(--line);border-radius:9px;padding:6px 10px;font-size:10.5px;font-weight:900;}
  .adbrand span{color:var(--mut);font-weight:700;padding:0 3px;}
  .admeta{display:flex;gap:7px;align-items:center;}
  .adtag{border:2px solid var(--line);border-radius:6px;padding:3px 7px;font-size:9px;font-weight:900;letter-spacing:.6px;}
  .adcount{font-size:11px;font-weight:900;letter-spacing:.5px;}
  .adcreative{flex:1;margin:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--alt);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;padding:20px 18px;position:relative;}
  .admid{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;}
  .adcap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .adcreative .play{width:54px;height:54px;border:2px solid var(--ink);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .adcreative .play svg{width:22px;height:22px;margin-left:3px;}
  .adstory{display:flex;gap:8px;width:100%;}
  .adstory .sframe{flex:1;height:112px;border:2px solid var(--soft);border-radius:8px;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:900;
    color:var(--mut);letter-spacing:.5px;}
  .adcreative .cap{font-size:9.5px;font-weight:900;letter-spacing:.8px;color:var(--anno);}
  .adcreative .sub{font-size:9px;font-weight:700;color:var(--mut);text-align:center;}
  .adbumper{border:2px solid var(--soft);border-radius:7px;padding:5px 11px;font-size:8.5px;font-weight:900;
    letter-spacing:.7px;color:var(--mut);}
  .adsound{font-size:8.5px;font-weight:900;letter-spacing:.5px;color:var(--mut);}
  .adfoot{padding:12px 16px 16px;}
  .adcta{border:2px solid var(--ink);border-radius:22px;background:var(--ink);color:#fff;text-align:center;
    font-size:11.5px;font-weight:900;letter-spacing:.6px;padding:13px;box-shadow:0 5px 0 0 var(--line);margin-bottom:12px;}
  .adbar{height:6px;border:2px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:7px;}
  .adbar i{display:block;height:100%;width:12%;background:var(--line);}
  .adhint{font-size:9px;font-weight:900;letter-spacing:.6px;color:var(--anno);text-align:center;}

  /* modal */
  .overlay{flex:1;background:var(--place);display:flex;align-items:center;justify-content:center;
    padding:18px;position:relative;}
  .ghostunder{position:absolute;inset:16px;display:flex;flex-direction:column;justify-content:space-between;opacity:.45;}
  .ghostunder .gb{background:var(--place2);border-radius:6px;height:14px;}
  .ghostunder .gwave{display:flex;align-items:center;gap:3px;height:52px;border:2px solid var(--place2);border-radius:10px;padding:0 8px;}
  .ghostunder .gwave i{flex:1;background:var(--place2);border-radius:2px;}
  .ghostunder .gbtn{background:var(--place2);border-radius:20px;height:40px;}

  /* reward chips (Frame 6) */
  .rewardrow{display:flex;gap:9px;margin-bottom:14px;}
  .rw{flex:1;border:2px solid var(--line);border-radius:10px;padding:9px 6px;text-align:center;
    font-size:8.5px;font-weight:900;letter-spacing:.4px;color:var(--anno);}
  .rw span{display:block;font-size:15px;color:var(--ink);margin-bottom:2px;}
  .modal{position:relative;border:2px solid var(--ink);border-radius:16px;background:#fff;padding:16px;width:100%;}
  .mrow{border:2px solid var(--soft);border-radius:11px;padding:11px;margin-bottom:9px;
    display:flex;align-items:center;gap:10px;}
  .mrow .ic{width:26px;height:26px;border:2px solid var(--line);border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:var(--line);flex:none;}
  .mrow .ic svg{width:15px;height:15px;}
  .mrow .lbl{font-size:9.5px;font-weight:900;letter-spacing:.6px;color:var(--anno);}
  .mrow .val{font-size:10px;font-weight:900;margin-top:3px;}
  .mrow .track{width:100%;height:6px;background:var(--place);border-radius:3px;margin-top:7px;position:relative;}
  .mrow .track i{position:absolute;top:0;left:0;height:100%;background:var(--line);border-radius:3px;}
  .mnote{border:2px dashed var(--mut);border-radius:10px;padding:9px;font-size:9px;font-weight:800;
    color:var(--mut);text-align:center;line-height:1.6;letter-spacing:.3px;margin-bottom:13px;}

  /* bridge */
  .bridgebox{flex:1;background:var(--alt);border-top:2px solid var(--soft);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;}
  .headsetwrap{position:relative;display:flex;align-items:center;justify-content:center;}
  .headsetwrap .hs{position:absolute;top:-18px;color:var(--line);}
  .headsetwrap .hs svg{width:38px;height:38px;}
  .bridgebox .line{border:2px solid var(--line);border-radius:10px;padding:10px 14px;font-size:11px;
    font-weight:900;letter-spacing:.5px;background:#fff;}
  .micring{width:54px;height:54px;border:2px solid var(--ink);border-radius:50%;display:flex;
    align-items:center;justify-content:center;color:var(--ink);}
  .micring svg{width:22px;height:22px;}
  .bridgenote{font-size:9.5px;font-weight:900;color:var(--anno);text-align:center;line-height:1.6;letter-spacing:.4px;}

  /* flow */
  .waveph{display:flex;align-items:center;gap:3px;height:56px;border:2px solid var(--line);
    border-radius:10px;padding:0 8px;background:var(--fill);}
  .waveph i{width:3px;background:var(--place2);border-radius:2px;flex:1;}
  .waveph.hot i{background:var(--line);}
  .turn{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start;}
  .turn.me{flex-direction:row-reverse;}
  .tbub{border:2px solid var(--soft);border-radius:12px;padding:9px 11px;min-width:120px;position:relative;}
  .turn.me .tbub{border-color:var(--line);}
  .turn.ai .tbub{border-color:var(--line);}
  .tlab{font-size:9px;font-weight:900;color:var(--mut);letter-spacing:.7px;margin-bottom:5px;}
  .bargin{position:absolute;right:-13px;top:-13px;width:26px;height:26px;border:2px dashed var(--line);border-radius:50%;}
  .mirror{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;background:var(--fill);margin:2px 0 10px;}
  .vadrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .vadpill{border:2px solid var(--line);border-radius:20px;padding:3px 9px;font-size:9px;font-weight:900;
    letter-spacing:.6px;display:flex;align-items:center;gap:5px;}
  .vadpill b{width:7px;height:7px;border-radius:50%;background:var(--ink);}
  .reserved{border:2px dashed var(--mut);border-radius:10px;padding:11px;font-size:9.5px;font-weight:900;
    color:var(--mut);text-align:center;letter-spacing:.5px;}

  /* report */
  .scorebox{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px;}
  .scorebox .num{width:74px;height:60px;border:2px solid var(--ink);border-radius:10px;background:var(--alt);
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;flex:none;}
  .wordcards{display:flex;gap:9px;margin-bottom:14px;}
  .wc{flex:1;border:2px solid var(--soft);border-radius:10px;padding:10px 6px;text-align:center;}
  .phoneme{border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;}
  .offerbox{border:2px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px;}
  .footline{font-size:9px;font-weight:900;color:var(--mut);text-align:center;letter-spacing:.5px;margin-top:2px;}

  .callout{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink);z-index:9;cursor:pointer;transition:transform .14s,opacity .14s;}
  .callout:hover{transform:scale(1.18);}
  .callout.active{transform:scale(1.34);}
  .callout.dim{opacity:.2;}

  .notesHead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .notesHead h2{font-size:15px;letter-spacing:.2px;}
  .notesHead em{font-style:normal;font-size:11.5px;color:var(--mut);font-weight:700;}
  .notesHead .core{background:var(--ink);color:#fff;font-size:9px;font-weight:900;padding:2px 6px;border-radius:4px;letter-spacing:.5px;}
  .notesHead .count{margin-left:auto;font-size:11px;font-weight:800;color:var(--mut);}
  .notesBody{height:614px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;padding-right:6px;}
  .anno{border:2px solid var(--soft);border-radius:12px;background:#fff;padding:12px 14px;
    display:flex;gap:12px;cursor:pointer;transition:.14s;}
  .anno:hover{border-color:var(--line);}
  .anno .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:11.5px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .anno .body{flex:1;font-size:12px;line-height:1.55;color:var(--anno);font-weight:700;}
  .anno .body b{color:var(--ink);}
  .anno.active{background:var(--ink);border-color:var(--ink);}
  .anno.active .n{background:#fff;color:var(--ink);}
  .anno.active .body{color:#E8E8E8;}
  .anno.active .body b{color:#fff;}
  .footnote{margin-top:10px;font-size:10.5px;color:var(--mut);font-weight:700;line-height:1.65;}
  .nav{display:flex;gap:10px;align-items:center;margin-top:11px;}
  .nav button{background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 15px;
    font-family:inherit;font-weight:900;font-size:11.5px;cursor:pointer;color:var(--ink);}
  .nav button:disabled{opacity:.3;cursor:default;}
  .nav .pos{font-size:11.5px;font-weight:900;color:var(--anno);}
  .nav .sp{flex:1;}
</style>
</head>
<body>

<header>
  <h1>Brand-Sponsored Flow Level<small>Greyscale wireflow · one frame per page · English UI / French lesson</small></h1>
  <div class="tools">
    <span class="hint">Click a number to link frame ↔ notes · ← → frames · Esc clears</span>
    <button class="tbtn" id="annoBtn" onclick="toggleCo()">Hide callouts</button>
  </div>
</header>

<div class="strip" id="strip"></div>
<div class="fbrow" id="fbrow"></div>

<div class="viewer">
  <div>
    <div class="stage"><div class="phone" id="phone"></div></div>
    <div class="nav">
      <button id="bPrev" onclick="move(-1)">◀ Prev</button>
      <span class="pos" id="pos">—</span>
      <span class="sp"></span>
      <button id="bNext" onclick="move(1)">Next ▶</button>
    </div>
  </div>
  <div class="notes">
    <div class="notesHead">
      <h2 id="fTitle">—</h2><em id="fSub"></em>
      <span class="core" id="fCore" style="display:none">CORE COMPONENT</span>
      <span class="count" id="fCount"></span>
    </div>
    <div class="notesBody" id="notesBody"></div>
    <div class="footnote" id="footnote"></div>
  </div>
</div>

<script>
/* ---------- inline SVG icons (greyscale) ---------- */
const I = {
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.6l5.4 5.4L20 6.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 2.4l3 6.1 6.7.9-4.9 4.6 1.2 6.6L12 17.5 6 20.6l1.2-6.6L2.3 9.4l6.7-.9z" fill="currentColor"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="11" rx="2.6" fill="currentColor"/><path d="M8 10.5V7.6a4 4 0 018 0v2.9" fill="none" stroke="currentColor" stroke-width="2.6"/></svg>',
  mic:'<svg viewBox="0 0 24 24"><rect x="9" y="2.2" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.2 11.4a6.8 6.8 0 0013.6 0" fill="none" stroke="currentColor" stroke-width="2.3"/><path d="M12 18.2v3.6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>',
  headphones:'<svg viewBox="0 0 24 24"><path d="M4 14.5v-2.6a8 8 0 0116 0v2.6" fill="none" stroke="currentColor" stroke-width="2.6"/><rect x="1.6" y="13.2" width="5.2" height="8.2" rx="2.2" fill="currentColor"/><rect x="17.2" y="13.2" width="5.2" height="8.2" rx="2.2" fill="currentColor"/></svg>',
  noise:'<svg viewBox="0 0 24 24"><path d="M3 12h2.2l2-5.2 3 10.4 3-14 2.8 12 1.8-3.2H21" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.6l12 7.4-12 7.4z" fill="currentColor"/></svg>',
  rocket:'<svg viewBox="0 0 24 24"><path d="M12 2.6c3.4 2 5.2 5.2 5.2 9.2L15 15H9l-2.2-3.2c0-4 1.8-7.2 5.2-9.2z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M9.4 16.6L12 21.6l2.6-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>'
};
const ic = (n,s)=>`<span class="ic" style="width:${s}px;height:${s}px">${I[n]}</span>`;

const SB = '<div class="statusbar"><span class="ph" style="width:34px;height:9px"></span><span class="ph" style="width:52px;height:9px"></span></div>';
const TB = `<div class="topbar"><div class="tbgrp"><span class="tbp"></span><span class="tbp"></span></div>
            <div class="tbgrp"><span class="tbx"></span></div></div>`;
const TBFLOW = `<div class="topbar"><div class="tbgrp"><span class="tbp" style="width:52px"></span></div>
            <div class="tbgrp"><span class="ph" style="width:44px;height:12px;border-radius:4px"></span>
            <span class="timer">3:00</span></div></div>`;

/* ================= viewer ================= */
const SCALE = 0.80;
let cur = 0, picked = null;

function renderStrip(){
  document.getElementById('strip').innerHTML = FRAMES.map((f,i)=>
    (i ? '<span class="sarrow">▶</span>' : '') +
    `<div class="step ${f.fallback?'fb':''} ${i===cur?'on':''}" onclick="go(${i})">${f.strip}` +
    (f.core ? '<span class="badge">CORE</span>' : '') + '</div>').join('');
  document.getElementById('fbrow').innerHTML =
    '<span class="hint">Branches:</span>' +
    '<div class="step fb" onclick="go(6)">noise &gt; 60 dB → Tap Mode</div>' +
    '<div class="step fb" onclick="go(2)">mic denied → back to Frame 3</div>' +
    '<div class="step fb" onclick="go(4)">3s silence → nudge, never a timeout</div>';
}

/* ---- callouts are anchored to real elements, so they can never drift ---- */
function placeCallouts(){
  const phone = document.getElementById('phone');
  const pr = phone.getBoundingClientRect();
  if(!pr.height) return;                       // no layout (e.g. jsdom) — skip silently
  phone.querySelectorAll('.callout').forEach(el=>{
    const t = phone.querySelector(el.dataset.tgt);
    if(!t) return;
    const r = t.getBoundingClientRect();
    const L=(r.left-pr.left)/SCALE, T=(r.top-pr.top)/SCALE;
    const R=(r.right-pr.left)/SCALE, B=(r.bottom-pr.top)/SCALE;
    let x, y;
    switch(el.dataset.pos){
      case 'left':   x = L - 30;      y = (T+B)/2 - 12; break;
      case 'corner': x = R - 14;      y = T - 12;       break;
      case 'center': x = (L+R)/2 - 12; y = (T+B)/2 - 12; break;
      default:       x = R + 6;       y = (T+B)/2 - 12;
    }
    el.style.left = Math.max(4, Math.min(369-24, x)) + 'px';
    el.style.top  = Math.max(4, Math.min(852-24, y)) + 'px';
  });
}

function render(){
  const f = FRAMES[cur];
  picked = null;
  document.getElementById('phone').innerHTML = f.body + f.callouts
    .map(c=>`<div class="callout" data-n="${c.n}" data-tgt="${c.tgt}" data-pos="${c.pos||'right'}"
              onclick="pick(${c.n})">${c.n}</div>`).join('');
  document.getElementById('notesBody').innerHTML = f.callouts
    .map(c=>`<div class="anno" data-n="${c.n}" onclick="pick(${c.n})">
        <span class="n">${c.n}</span><span class="body">${c.html}</span></div>`).join('');
  document.getElementById('fTitle').textContent = f.title;
  document.getElementById('fSub').textContent = f.sub;
  document.getElementById('fCore').style.display = f.core ? '' : 'none';
  document.getElementById('fCount').textContent = (cur+1) + ' / ' + FRAMES.length + ' frames';
  document.getElementById('footnote').textContent = f.footnote;
  document.getElementById('pos').textContent = (cur+1) + ' / ' + FRAMES.length;
  document.getElementById('bPrev').disabled = cur === 0;
  document.getElementById('bNext').disabled = cur === FRAMES.length-1;
  renderStrip();
  placeCallouts();
  requestAnimationFrame(placeCallouts);        // re-anchor once fonts settle
}

function pick(n){
  picked = (picked === n) ? null : n;
  document.querySelectorAll('.callout').forEach(el=>{
    const on = +el.dataset.n === picked;
    el.classList.toggle('active', on);
    el.classList.toggle('dim', picked !== null && !on);
  });
  document.querySelectorAll('.anno').forEach(el=>{
    const on = +el.dataset.n === picked;
    el.classList.toggle('active', on);
    if(on && typeof el.scrollIntoView === 'function') el.scrollIntoView({block:'nearest', behavior:'smooth'});
  });
}
function go(i){ cur = Math.max(0, Math.min(FRAMES.length-1, i)); render(); }
function move(d){ go(cur + d); }
function toggleCo(){
  const on = document.body.classList.toggle('noCo');
  document.getElementById('annoBtn').textContent = on ? 'Show callouts' : 'Hide callouts';
}
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') move(1);
  if(e.key === 'ArrowLeft')  move(-1);
  if(e.key === 'Escape'){ picked = null;
    document.querySelectorAll('.callout,.anno').forEach(el=>el.classList.remove('active','dim')); }
});
window.addEventListener('resize', placeCallouts);

render();
/* deep link: wireflow.html#core  /  wireflow.html#core:3 */
(function(){
  const h = decodeURIComponent(location.hash.replace('#',''));
  if(!h) return;
  const parts = h.split(':');
  const i = FRAMES.findIndex(f => f.id === parts[0]);
  if(i >= 0){ cur = i; render(); if(parts[1]) pick(+parts[1]); }
})();
</script>
